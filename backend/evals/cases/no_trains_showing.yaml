# Typical routes with nothing in the feed: say so, never an empty answer.
# The Z runs rush hours only; the fixture was recorded at 1:59 PM on a Monday.
- id: none-z-canal-downtown
  category: no_trains_showing
  turns: ["next downtown Z at Canal St"]
  expect:
    slots: {complex_id: 623, route: Z, direction: S}
    status: no_trains_showing
    max_turns: 1
    reply_matches: "no (\\w+ )*trains?|not (seeing|showing)|aren't any|isn't showing|nothing"
