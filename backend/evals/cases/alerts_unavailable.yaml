- id: feeds-stale-1-96
  category: alerts_unavailable
  # Every feed is 200s old: times must be reported "as of" the snapshot.
  setup: {clock_offset: 200}
  turns: ["uptown 1 at 96 St"]
  expect:
    slots: {complex_id: 310, route: "1", direction: N}
    max_turns: 1
    reply_matches: "as of|1:59"
