# Alerts missing or stale: say delays couldn't be checked; never claim "no delays".
# (The "no delays" and fabrication checks run on every case; these make them bite.)
- id: alerts-missing-6-86
  category: alerts_unavailable
  setup: {variant: alerts_missing}
  turns: ["next downtown 6 at 86th"]
  expect:
    slots: {complex_id: 397, route: "6", direction: S}
    max_turns: 1
    reply_matches: "(couldn't|could not|can't|unable|not able|wasn't able).{0,30}(check|confirm|verify|get|load|see)"
- id: alerts-missing-any-delays-l
  category: alerts_unavailable
  setup: {variant: alerts_missing}
  turns: ["Any delays on the L right now?"]
